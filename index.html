<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14211f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FlatRoute</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed map; one control sheet (bottom on phones, left rail on desktop). */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#14211f; --muted:#5c6b67; --line:#d9e0dc;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --g1:#1a9e6e; --g2:#b9a21a; --g3:#e07b1f; --g4:#d23b2f; --alt:#7c8a86;
  --shadow:0 8px 28px rgba(20,33,31,.18);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#17211f; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633;
  --accent:#3cc2ad; --accent-ink:#06201c; --accent-soft:#163a35;
  --g1:#34c48b; --g2:#d8c23a; --g3:#f0913a; --g4:#ef5a4c; --alt:#8a9893;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#17211f; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633;
  --accent:#3cc2ad; --accent-ink:#06201c; --accent-soft:#163a35;
  --g1:#34c48b; --g2:#d8c23a; --g3:#f0913a; --g4:#ef5a4c; --alt:#8a9893;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{font-family:var(--body)}
.hint{position:fixed;z-index:500;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
  font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;box-shadow:var(--shadow);white-space:nowrap}
.fab{position:fixed;z-index:500;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;max-height:72vh;display:flex;flex-direction:column;
  background:var(--surface);border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:var(--shadow);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.min .body{display:none}
.grab{border:0;background:none;width:100%;padding:8px 0 4px;cursor:pointer;display:grid;place-items:center}
.grab span{width:40px;height:4px;border-radius:2px;background:var(--line)}
.body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{margin:0;font:700 26px/1 var(--display);letter-spacing:.01em}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand small{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.lab b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;border:0;background:var(--bg);color:var(--ink);font:600 20px var(--display);cursor:pointer}
.stepper input{flex:1;min-width:0;border:0;text-align:center;font:600 20px var(--display);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--bg)}
.seg button{flex:1;border:0;border-radius:7px;padding:8px 4px;background:transparent;color:var(--muted);font:600 14px var(--display);letter-spacing:.03em;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.check{display:flex;margin-top:4px;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.check input{accent-color:var(--accent);width:18px;height:18px}
.go{border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--accent-ink);font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.go:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.status .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.status .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status.err{color:var(--g4)}
.results{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--surface);text-align:left;color:var(--ink);font:inherit}
.card[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card .top{display:flex;align-items:center;gap:10px}
.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--display);background:var(--ink);color:var(--surface);flex:none}
.card[aria-pressed=true] .rank{background:var(--accent);color:var(--accent-ink)}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.stat b small{font:600 13px var(--display);color:var(--muted)}
.stat span{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.where{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.stat b.bad{color:var(--g4)}
.prof{width:100%;height:56px;display:block}
.prof text{fill:var(--muted);font:600 10px var(--display)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.calib{display:flex;flex-direction:column;gap:10px;font-size:14px}
.calib h2{margin:0;font:700 20px var(--display)}
.calib .big{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.calib .note{color:var(--muted);font-size:13px}
.calib .tbl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.calib table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.calib th,.calib td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.calib th:first-child,.calib td:first-child{text-align:left}
.calib th{position:sticky;top:0;background:var(--surface);font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.calib .pair{display:flex;gap:18px;flex-wrap:wrap}
.acts a,.acts button{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:var(--bg);color:var(--ink);font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.acts .filebtn{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:var(--bg);color:var(--ink);font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.acts .filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.acts .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:600 12px var(--display);letter-spacing:.04em;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:14px;height:4px;border-radius:2px;display:block}
.warn{font-size:13px;color:var(--g3)}
.pin{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:var(--shadow)}
.startpin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--display);background:var(--ink);color:var(--surface);border:2px solid var(--surface);box-shadow:var(--shadow)}
.turn{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--ink);color:var(--surface);border:2px solid var(--surface);box-shadow:var(--shadow)}
.turn.u{background:var(--g3);color:#fff}
.directions{display:flex;flex-direction:column;gap:8px}
.directions:empty{display:none}
.dir-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dir-head h3{margin:0;font:700 18px var(--display)}
.dir-head span{font:600 13px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.fw{display:flex;align-items:center;gap:8px}
.fw input{flex:1;min-width:0;accent-color:var(--ink)}
.fw button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}
.fw-next{font:600 15px var(--display);background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 12px}
.cues{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto}
.cue{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.cue:last-child{border-bottom:0}
.cue:hover{background:var(--bg)}
.cue.cur{background:var(--accent-soft)}
.cue .mi{font:600 12px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.cue .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--ink);color:var(--surface);font-size:12px}
.cue .ic.U{background:var(--g3);color:#fff}
.cue .ic.S,.cue .ic.F{background:var(--accent);color:var(--accent-ink)}
.cue .ic.C{background:var(--line);color:var(--ink)}
.me{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:var(--shadow);position:relative}
.me i{position:absolute;left:50%;top:-9px;width:0;height:0;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid var(--accent);transform-origin:6px 20px;transform:rotate(var(--r))}
.mile{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);border:2px solid var(--ink);font:700 11px var(--display);box-shadow:var(--shadow)}
.arrow{width:16px;height:16px;display:grid;place-items:center;color:var(--surface);font-size:11px;line-height:1;text-shadow:0 0 2px var(--ink),0 0 2px var(--ink)}
.sflabel{position:absolute;left:30px;top:3px;white-space:nowrap;background:var(--ink);color:var(--surface);font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:6px}
.startpin.on{background:var(--accent);color:var(--accent-ink)}
@media (min-width:820px){
  .sheet{left:calc(env(safe-area-inset-left,0px) + 12px);right:auto;top:12px;bottom:12px;width:380px;max-height:none;border-radius:18px}
  .grab{display:none}
  .hint{left:calc(50% + 196px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>
<div class="hint" id="hint">Tap the map to drop a pin</div>
<button class="fab" id="locate" aria-label="Use my location" title="Use my location">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<section class="sheet" id="sheet">
  <button class="grab" id="grab" aria-label="Show or hide controls"><span></span></button>
  <div class="body">
    <div class="brand"><h1>Flat<i>Route</i></h1><small id="pinlabel">No pin yet</small></div>

    <div class="row">
      <div class="field">
        <div class="lab"><label for="radius">Start within</label><b id="radiusOut">1.0 mi</b></div>
        <input type="range" id="radius" min="0.25" max="5" step="0.25" value="1">
      </div>
      <div class="field">
        <div class="lab"><label for="dist">Distance (mi)</label></div>
        <div class="stepper"><button type="button" data-step="-0.5" aria-label="Shorter">−</button><input id="dist" type="number" inputmode="decimal" min="0.5" max="26.2" step="0.1" value="5"><button type="button" data-step="0.5" aria-label="Longer">+</button></div>
      </div>
    </div>

    <div class="field">
      <div class="lab">Route</div>
      <div class="seg" id="type"><button data-v="ob" aria-pressed="true">Out &amp; back</button><button data-v="loop" aria-pressed="false">Loop</button></div>
      <label class="check" id="streetsRow"><input type="checkbox" id="streets"> Finish streets (runs every segment of each street it takes; long streets can be partial)</label>
    </div>
    <div class="row">
      <div class="field">
        <div class="lab">Flattest by</div>
        <div class="seg" id="mode"><button data-v="grade" aria-pressed="true">Max grade</button><button data-v="climb" aria-pressed="false">Climb</button></div>
      </div>
      <div class="field">
        <div class="lab">Tolerance</div>
        <div class="seg" id="tol"><button data-v="0.1" aria-pressed="false">±.1</button><button data-v="0.25" aria-pressed="true">±.25</button><button data-v="0.5" aria-pressed="false">±.5</button></div>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="paths"> Include trails and paths (streets only when off)</label>

    <div class="field history">
      <div class="lab">My runs <b id="histOut">None loaded</b></div>
      <div class="acts">
        <label class="filebtn">Load history<input type="file" id="histFile" accept=".json,application/json" hidden></label>
        <label class="filebtn">Add runs<input type="file" id="gpxFile" accept=".gpx,.tcx" multiple hidden></label>
        <label class="filebtn">Check climb<input type="file" id="checkFile" accept=".gpx" hidden></label>
        <label class="filebtn">Calibrate<input type="file" id="calibFile" accept=".json,application/json" hidden></label>
        <button type="button" id="histClear" hidden>Clear</button>
      </div>
    </div>

    <button class="go" id="go" disabled>Drop a pin first</button>
    <div class="status" id="status" hidden><span id="statusText"></span><div class="bar"><i id="bar"></i></div></div>

    <div class="results" id="results"></div>
    <section class="directions" id="directions" aria-label="Turn-by-turn directions"></section>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* FlatRoute engine: street graph, grade profiles, route search. No DOM. */
(function (root) {
  'use strict';
  const RE = 6371008.8, D2R = Math.PI / 180;

  function hav(lat1, lon1, lat2, lon2) {
    const dLat = (lat2 - lat1) * D2R, dLon = (lon2 - lon1) * D2R;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * D2R) * Math.cos(lat2 * D2R) * Math.sin(dLon / 2) ** 2;
    return 2 * RE * Math.asin(Math.min(1, Math.sqrt(a)));
  }
  function dest(lat, lon, brgDeg, d) {
    const b = brgDeg * D2R, dr = d / RE, la = lat * D2R, lo = lon * D2R;
    const la2 = Math.asin(Math.sin(la) * Math.cos(dr) + Math.cos(la) * Math.sin(dr) * Math.cos(b));
    const lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(dr) * Math.cos(la), Math.cos(dr) - Math.sin(la) * Math.sin(la2));
    return [la2 / D2R, lo2 / D2R];
  }

  /* ---------- min-heap ---------- */
  class Heap {
    constructor() { this.k = []; this.v = []; }
    get size() { return this.k.length; }
    clear() { this.k.length = 0; this.v.length = 0; }
    push(key, val) {
      const k = this.k, v = this.v; let i = k.length; k.push(key); v.push(val);
      while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= key) break; k[i] = k[p]; v[i] = v[p]; i = p; }
      k[i] = key; v[i] = val;
    }
    pop() {
      const k = this.k, v = this.v, topK = k[0], topV = v[0];
      const lk = k.pop(), lv = v.pop(), n = k.length;
      if (n) {
        let i = 0;
        for (;;) {
          let c = 2 * i + 1; if (c >= n) break;
          if (c + 1 < n && k[c + 1] < k[c]) c++;
          if (k[c] >= lk) break;
          k[i] = k[c]; v[i] = v[c]; i = c;
        }
        k[i] = lk; v[i] = lv;
      }
      this.lastKey = topK; return topV;
    }
  }

  /* ---------- graph from Overpass JSON ---------- */
  function buildGraph(osm) {
    const coord = new Map(), ways = [];
    for (const el of osm.elements) {
      if (el.type === 'node') coord.set(el.id, [el.lat, el.lon]);
      else if (el.type === 'way' && el.nodes) ways.push(el);
    }
    const cnt = new Map();
    for (const w of ways) for (const id of w.nodes) cnt.set(id, (cnt.get(id) || 0) + 1);
    const vIndex = new Map(), V = [], E = [];
    const vid = (id) => { let i = vIndex.get(id); if (i === undefined) { i = V.length; vIndex.set(id, i); V.push(coord.get(id)); } return i; };
    for (const w of ways) {
      const ids = w.nodes.filter((id) => coord.has(id));
      if (ids.length < 2) continue;
      const t = w.tags || {};
      const flat = !!(t.bridge && t.bridge !== 'no') || !!(t.tunnel && t.tunnel !== 'no');
      let s = 0;
      for (let i = 1; i < ids.length; i++) {
        if (i === ids.length - 1 || cnt.get(ids[i]) > 1) {
          const pts = ids.slice(s, i + 1).map((id) => coord.get(id));
          let len = 0;
          for (let j = 1; j < pts.length; j++) len += hav(pts[j - 1][0], pts[j - 1][1], pts[j][0], pts[j][1]);
          const a = vid(ids[s]), b = vid(ids[i]);
          if (len > 0.5 && a !== b) E.push({ a, b, pts, len, bridge: flat, name: t.name || '' });
          s = i;
        }
      }
    }
    const adj = V.map(() => []);
    E.forEach((e, i) => { adj[e.a].push(i); adj[e.b].push(i); });
    return { V, E, adj };
  }

  /* ---------- elevation profiles & grades ---------- */
  const STEP = 20, WIN = 100, GCAP = 0.25;
  /* Gaussian-smooth an elevation profile over distance, then count climb with a hysteresis
     threshold so DEM noise of a few feet doesn't add up to phantom hills. */
  const CLIMB = { sigma: 40, hyst: 1.5 };
  function setClimb(sigma, hyst) { CLIMB.sigma = sigma; CLIMB.hyst = hyst; }
  function smoothClimb(d, z, sigma = CLIMB.sigma, hyst = CLIMB.hyst) {
    const n = d.length;
    if (n < 2) return { up: 0, dn: 0, zs: z.slice() };
    const zs = new Array(n); let lo = 0;
    for (let i = 0; i < n; i++) {
      while (d[i] - d[lo] > 3 * sigma) lo++;
      let sw = 0, sz = 0;
      for (let j = lo; j < n && d[j] - d[i] <= 3 * sigma; j++) {
        const w = Math.exp(-((d[j] - d[i]) ** 2) / (2 * sigma * sigma)); sw += w; sz += w * z[j];
      }
      zs[i] = sz / sw;
    }
    let up = 0, dn = 0, ref = zs[0];
    for (let i = 1; i < n; i++) {
      const dz = zs[i] - ref;
      if (dz >= hyst) { up += dz; ref = zs[i]; } else if (dz <= -hyst) { dn -= dz; ref = zs[i]; }
    }
    return { up, dn, zs };
  }
  function computeProfiles(G, elev) {
    for (const e of G.E) {
      // resample along polyline
      const d = [0], ll = [e.pts[0]];
      let acc = 0, next = STEP;
      for (let j = 1; j < e.pts.length; j++) {
        const p = e.pts[j - 1], q = e.pts[j];
        const seg = hav(p[0], p[1], q[0], q[1]);
        while (next < acc + seg) {
          const f = (next - acc) / seg;
          d.push(next); ll.push([p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f]);
          next += STEP;
        }
        acc += seg;
      }
      if (e.len - d[d.length - 1] > 2) { d.push(e.len); ll.push(e.pts[e.pts.length - 1]); }

  if (!r) { box.innerHTML = ''; return; }
  const cues = cuesOf(r);
  box.innerHTML = `<div class="dir-head"><h3>Directions · route ${S.sel + 1}</h3><span id="fwMile"></span></div>
    <div class="fw">
      <button type="button" id="fwPrev" aria-label="Previous turn">◀</button>
      <input type="range" id="fwRange" min="0" max="${r.len.toFixed(0)}" step="5" value="0" aria-label="Step through the route">
      <button type="button" id="fwNextBtn" aria-label="Next turn">▶</button>
    </div>
    <div class="fw-next" id="fwNext"></div>
    <ol class="cues">${cues.map((c, k) => `<li class="cue" data-d="${c.dist.toFixed(0)}" data-k="${k}"><span class="ic ${c.kind}">${CUE_ICON[c.kind]}</span><span class="tx">${c.text.replace(/</g, '&lt;')}</span><span class="mi">${(c.dist / MI).toFixed(2)}</span></li>`).join('')}</ol>`;
  $('fwRange').oninput = (e) => { followD = +e.target.value; drawFollow(true); };
  const jump = (dir) => {
    const list = cues.map((c) => c.dist);
    const t = dir > 0 ? list.find((d) => d > followD + 5) : [...list].reverse().find((d) => d < followD - 5);
    if (t != null) { followD = t; drawFollow(false); focusAt(); }
  };
  $('fwPrev').onclick = () => jump(-1); $('fwNextBtn').onclick = () => jump(1);
  box.querySelectorAll('.cue').forEach((el) => el.onclick = () => { followD = +el.dataset.d; drawFollow(false); focusAt(); });
  followD = 0; drawFollow(false);
}
const CUE_ICON = {
  S: '●', F: '⚑', C: '↑',
  L: TURN_SVG.L, R: TURN_SVG.R, U: TURN_SVG.U
};

function select(i) {
  S.sel = i; drawRoutes(false); renderDirections();
  $('results').querySelectorAll('.card').forEach((c, j) => c.setAttribute('aria-pressed', String(j === i)));
  const r = S.routes[i]; map.panInside(r.start, { padding: [60, 60] });
}
function profileSVG(r) {
  const W = 320, H = 56, P = 2, d = r.prof.d, z = r.prof.z;
  let lo = Math.min(...z), hi = Math.max(...z);
  const span = Math.max(hi - lo, 30); const mid = (hi + lo) / 2; lo = mid - span / 2; hi = mid + span / 2;
  const L = d[d.length - 1] || 1, step = Math.max(1, Math.floor(d.length / 160));
  let path = '';
  for (let i = 0; i < d.length; i += step) path += (path ? 'L' : 'M') + (P + (d[i] / L) * (W - 2 * P)).toFixed(1) + ',' + (H - 14 - ((z[i] - lo) / (hi - lo)) * (H - 22)).toFixed(1);
  path += 'L' + (W - P) + ',' + (H - 14 - ((z[z.length - 1] - lo) / (hi - lo)) * (H - 22)).toFixed(1);
  const area = path + `L${W - P},${H - 12}L${P},${H - 12}Z`;
  const ft = (m) => Math.round(m * FT);
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Elevation profile">
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <text x="${P}" y="${H - 1}">${ft(Math.min(...z))}–${ft(Math.max(...z))} ft elevation</text>
  </svg>`;
}
function renderResults() {
  const box = $('results'); box.innerHTML = '';
  if (S.routes[0] && S.routes[0].offTarget) box.insertAdjacentHTML('beforeend', `<div class="warn">Nothing hit your tolerance. These are the closest matches.</div>`);
  const byNew = H && S.routes[0] && S.routes[0].type === 'loop' && S.streets;
  box.insertAdjacentHTML('beforeend', byNew
    ? `<div class="legend"><span><i style="background:var(--accent)"></i>New to you</span><span><i style="background:var(--alt)"></i>Already run</span></div>`
    : `<div class="legend"><span><i style="background:var(--g1)"></i>≤1%</span><span><i style="background:var(--g2)"></i>≤2.5%</span><span><i style="background:var(--g3)"></i>≤4%</span><span><i style="background:var(--g4)"></i>&gt;4%</span></div>`);
  S.routes.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'card'; card.setAttribute('role', 'button'); card.tabIndex = 0; card.setAttribute('aria-pressed', String(i === S.sel));
    card.innerHTML = `<div class="top"><div class="rank">${i + 1}</div>
      <div class="stats">
        <div class="stat"><b>${(r.len / MI).toFixed(2)}</b><span>miles</span></div>
        <div class="stat"><b>${(r.mx * 100).toFixed(1)}%</b><span>max grade</span></div>
        <div class="stat"><b>${Math.round(r.climb * FT)}${climbBand(r) != null ? `<small> ±${climbBand(r)}</small>` : ''}</b><span>ft climb</span></div>
        ${r.type === 'loop' && r.done != null
          ? `<div class="stat"><b>${r.done}</b><span>streets finished</span></div><div class="stat"><b class="${r.partial ? 'bad' : ''}">${r.partial}</b><span>left partial</span></div><div class="stat"><b>${(r.newLen / MI).toFixed(1)}</b><span>new mi</span></div>`
          : r.type === 'loop' ? `<div class="stat"><b>${r.streets}</b><span>streets</span></div><div class="stat"><b>${Math.round(r.repeat * 100)}%</b><span>repeated</span></div>` : ''}
      </div></div>
      <div class="where"></div>
      ${profileSVG(r)}
      <div class="acts"><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${r.start[0].toFixed(6)},${r.start[1].toFixed(6)}">Go to start</a><button class="primary" type="button">Export GPX</button></div>`;
    card.querySelector('.where').textContent = r.done != null
      ? (r.doneNames.length ? 'Finishes: ' + r.doneNames.join(', ') : 'Finishes no streets') + (r.partialNames.length ? ' · Leaves partial: ' + r.partialNames.join(', ') : '') + (r.longLen > 50 ? ` · plus ${(r.longLen / MI).toFixed(1)} mi on long streets` : '')
      : (r.type === 'ob' ? 'Out & back' : 'Loop') + (r.name ? ' · ' + r.name : '');
    card.addEventListener('click', (e) => { if (e.target.closest('a,button')) return; select(i); });
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(i); } });
    card.querySelector('button').onclick = () => exportGPX(r, i);
    box.appendChild(card);
  });
  renderDirections();
}
function exportGPX(r, i) {
  const elev = cache && cache.elev;
  const name = `FlatRoute ${(r.len / MI).toFixed(1)} mi ${r.type === 'ob' ? 'out-and-back' : 'loop'}`;
  const pts = r.coords.map((p) => `<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}">${elev && isFinite(elev(p[0], p[1])) ? `<ele>${elev(p[0], p[1]).toFixed(1)}</ele>` : ''}</trkpt>`).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="FlatRoute" xmlns="http://www.topografix.com/GPX/1/1">
<metadata><name>${name}</name></metadata>
<trk><name>${name}</name><type>running</type><trkseg>
${pts}
</trkseg></trk></gpx>`;
  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const file = new File([blob], `flatroute-${(r.len / MI).toFixed(1)}mi-${r.type}-${i + 1}.gpx`, { type: 'application/gpx+xml' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(() => download(blob, file.name));
  } else download(blob, file.name);
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

drawPin();
})();
</script>
</body>
</html>
